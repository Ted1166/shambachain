[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
cache_path     = "cache"
via_ir         = true
optimizer      = true
optimizer_runs = 200
solc_version   = "0.8.28"

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
hedera_testnet = "${HEDERA_TESTNET_RPC}"
hedera_mainnet = "${HEDERA_MAINNET_RPC}"

[etherscan]
hedera_testnet = { key = "${HEDERA_API_KEY}", url = "https://hashscan.io" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
